<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="gitupdate-token" content="__TOKEN__">
<meta name="gitupdate-theme" content="__THEME__">
<title>Git Update</title>
<script>
/* 밝기는 기본이 light. 스타일시트보다 먼저 확정해 첫 페인트에서 번쩍이지 않게 한다. */
(function () {
  var pref = document.querySelector('meta[name=gitupdate-theme]').content;
  var dark = pref === "dark" ||
    (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  if (dark) document.documentElement.classList.add("dark");
})();
</script>
<style>
/* 토큰 인증이 붙은 주소라서 폰트 선언은 토큰이 치환되는 이 블록에 둔다. */
@font-face{
  font-family:"Cafe24 PRO UP";
  src:url("/fonts/Cafe24PROUP.otf?t=__TOKEN__") format("opentype");
  font-weight:100 900;   /* 단일 굵기 서체 — 가짜 볼드를 만들지 않는다 */
  font-style:normal;
  font-display:swap;
}
</style>
<link rel="stylesheet" href="/tokens.css?t=__TOKEN__">
<link rel="stylesheet" href="/quiet-observer.css?t=__TOKEN__">
</head>
<body data-view="repos">

<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-name">Git Update</span>
    </div>

    <nav class="nav" id="nav" aria-label="화면">
      <button class="nav-item on" data-view="repos" data-filter="all" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10M8 8h5"/></svg>
        <span>Repositories</span>
      </button>
      <button class="nav-item" data-view="repos" data-filter="update">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        <span>Updates</span>
        <b id="navcount"></b>
      </button>
      <button class="nav-item" data-view="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 3.5 12 2.5-6h5.5"/></svg>
        <span>Activity</span>
      </button>
      <button class="nav-item" data-act="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 7L4.6 7a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-foot">
    <button class="railbtn" id="btn-theme"></button>

    <button class="workspace" id="btn-workspace" title="검색 폴더와 업데이트 방식 설정 (,)">
      <span class="avatar" aria-hidden="true">GU</span>
      <span class="who">
        <b>Workspace</b>
        <small id="wsinfo">준비 중</small>
      </span>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>
    </div>
  </aside>

  <div class="main">
    <div class="progress" id="progress"></div>

    <header class="head">
      <div class="titles">
        <h1 id="viewtitle">Repositories</h1>
        <p id="subtitle">저장소를 찾고 있습니다…</p>
      </div>
      <div class="acts">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search repositories…" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>
        <button class="btn icon" id="btn-refresh" title="다시 검색 · 네트워크 없음 (R)" aria-label="다시 검색">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="btn icon" id="btn-fetch" title="모든 저장소의 원격 상태 확인 (F)" aria-label="원격 확인">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        </button>
        <button class="btn accent" id="btn-updateall" title="받을 커밋이 있는 저장소를 한 번에 업데이트">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21V9"/><path d="M7 14l5 5 5-5"/><path d="M5 4h14"/></svg>
          <span>전체 업데이트</span><span id="allcount"></span>
        </button>
      </div>
    </header>

    <section class="view view-repos">
      <div class="tools">
        <div class="chips" id="chips" role="tablist" aria-label="상태 필터">
          <button class="chip on" data-f="all" role="tab" aria-selected="true">전체<b></b></button>
          <button class="chip" data-f="update" role="tab" aria-selected="false">업데이트<b></b></button>
          <button class="chip" data-f="dirty" role="tab" aria-selected="false">로컬 변경<b></b></button>
          <button class="chip" data-f="clean" role="tab" aria-selected="false">최신<b></b></button>
          <button class="chip" data-f="issue" role="tab" aria-selected="false">확인 필요<b></b></button>
        </div>
        <div class="spacer"></div>
        <label class="field" for="sortby">정렬
          <select id="sortby" title="목록 정렬 기준">
            <option value="priority">우선순위</option>
            <option value="recent">최근 확인</option>
            <option value="name">이름</option>
          </select>
        </label>
        <label class="field" for="strategy">기본 방식
          <select id="strategy" title="업데이트 버튼이 쓰는 기본 방식입니다. 저장소별로는 ⋯ 메뉴에서 rebase / merge 를 바로 실행할 수 있습니다.&#10;ff-only: 로컬 커밋이 있으면 중단 (안전)&#10;rebase: 원격 커밋 위로 내 커밋을 다시 쌓음&#10;merge: 병합 커밋을 만들어 합침">
            <option value="ff-only">ff-only</option>
            <option value="rebase">rebase</option>
            <option value="merge">merge</option>
          </select>
        </label>
        <div class="segmented" id="layout" role="group" aria-label="목록 모양">
          <button class="seg on" data-layout="list" aria-pressed="true" title="목록으로 보기" aria-label="목록으로 보기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button class="seg" data-layout="grid" aria-pressed="false" title="카드로 보기" aria-label="카드로 보기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
          </button>
        </div>
      </div>

      <div class="list" id="list"></div>

      <div class="tally" id="tally">
        <button class="tallyhead" id="tallyhead" aria-expanded="false" aria-controls="tallybody">
          <span id="tallytitle">전체 0개</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="tallybody" id="tallybody"></div>
      </div>
    </section>

    <section class="view view-activity">
      <div class="logcard" id="logcard">
        <div class="loghead">
          <h2>실행 기록</h2>
          <span class="count" id="logcount"></span>
        </div>
        <div class="logbody" id="logbody"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="status" id="status"><span class="dot"></span><span id="statustext">준비 중</span></div>
      <div class="grow"></div>
      <span class="hint" id="gitver"></span>
      <button class="btn quiet tiny" id="btn-help" title="단축키 보기">도움말</button>
      <button class="btn quiet tiny" id="btn-quit" title="서버 종료">종료</button>
    </footer>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog id="settings">
  <div class="dlg-head">
    <h2>설정</h2>
    <p>git 저장소를 찾을 폴더와 업데이트 방식을 정합니다.</p>
  </div>
  <div class="dlg-body">
    <div class="group">
      <label>검색할 폴더</label>
      <div class="rootlist" id="rootlist"></div>
      <div class="inline">
        <button class="btn" id="btn-pick">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/></svg>
          폴더 선택
        </button>
        <input type="text" id="rootinput" placeholder="또는 경로 직접 입력 후 Enter  (예: ~/work)">
      </div>
    </div>
    <div class="group">
      <label>하위 탐색 깊이 / 제외 폴더</label>
      <div class="inline">
        <input type="number" id="depth" min="1" max="8" step="1">
        <input type="text" id="excludes" placeholder="node_modules, .venv, build">
      </div>
    </div>
    <div class="group">
      <label>업데이트 동작</label>
      <label class="check"><input type="checkbox" id="autostash">
        <span>업데이트 전 로컬 변경 자동 보관
          <small>git pull --autostash. 끝나면 되돌려 놓습니다.</small></span>
      </label>
      <label class="check"><input type="checkbox" id="fetchstart">
        <span>시작할 때 모든 저장소 원격 확인
          <small>정확한 "받을 커밋" 수를 바로 보여주지만 저장소가 많으면 몇 초 걸립니다.</small></span>
      </label>
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="btn-cancel">취소</button>
    <button class="btn accent" id="btn-save">저장하고 다시 검색</button>
  </div>
</dialog>

<dialog id="stashdlg">
  <div class="dlg-head">
    <h2>보관 (stash)</h2>
    <p id="stashrepo"></p>
  </div>
  <div class="dlg-body">
    <div class="group">
      <label>지금 작업 내용 보관</label>
      <div class="inline">
        <input type="text" id="stashmsg" placeholder="메모 (선택)  예: 작업 중 UI 수정">
        <button class="btn accent" id="btn-stashnow">보관하기</button>
      </div>
      <label class="check"><input type="checkbox" id="stashuntracked" checked>
        <span>추적 안 된 새 파일도 함께 보관
          <small>git stash push --include-untracked</small></span>
      </label>
    </div>
    <div class="group">
      <label>보관된 항목 <span id="stashcount" class="soft"></span></label>
      <div class="stashlist" id="stashlist"></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="btn-stashclose">닫기</button>
  </div>
</dialog>

<dialog id="helpdlg">
  <div class="dlg-head">
    <h2>단축키</h2>
    <p>입력창에 커서가 없을 때 동작합니다.</p>
  </div>
  <div class="dlg-body">
    <dl class="keys">
      <dt><kbd>/</kbd></dt><dd>검색창 포커스</dd>
      <dt><kbd>R</kbd></dt><dd>다시 검색 (네트워크 없음)</dd>
      <dt><kbd>F</kbd></dt><dd>모든 저장소 원격 확인 (fetch)</dd>
      <dt><kbd>,</kbd></dt><dd>설정 열기</dd>
      <dt><kbd>Esc</kbd></dt><dd>창·메뉴 닫기</dd>
    </dl>
    <p class="muted">저장소별 rebase / merge / 보관은 각 행의 <b>⋯</b> 메뉴에 있습니다.</p>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="btn-helpclose">닫기</button>
  </div>
</dialog>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name=gitupdate-token]').content;
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

const STATE_LABEL = {
  behind: "업데이트 있음", diverged: "분기됨", clean: "최신", dirty: "로컬 변경", ahead: "푸시 대기",
  "no-upstream": "원격 없음", detached: "HEAD 분리", error: "오류", loading: "확인 중",
};
const PILL_CLASS = { behind:"behind", diverged:"diverged", clean:"clean", dirty:"dirty", ahead:"ahead", error:"error" };
const BUSY_LABEL = { pull: "업데이트 중", fetch: "확인 중", stash: "보관 처리 중" };
const VIEW_TITLE = { repos: "Repositories", activity: "Activity" };
const THEME_ORDER = ["light", "dark", "auto"];
const THEME_LABEL = { light: "밝게", dark: "어둡게", auto: "시스템 따라" };
const THEME_ICON = {
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg>',
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>',
};
const REPO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10M8 8h5"/></svg>';
const byName = (a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase());
const SORTS = {
  priority: (a, b) => a.rank - b.rank || byName(a, b),
  recent: (a, b) => (b.last_fetch || 0) - (a.last_fetch || 0) || byName(a, b),
  name: byName,
};

let snap = null;            // 서버 상태
let filter = "all";
let query = "";
let view = "repos";
let sortBy = "priority";
let openMenu = null;
let firstLoad = true;
const rows = new Map();     // path -> {node, refs}
let draftRoots = null;

/* ---------------- 통신 ---------------- */
async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body || {}),
  });
  if (!res.ok) throw new Error(path + " → " + res.status);
  return res.json();
}

async function poll() {
  try {
    snap = await api("/api/state");
    render();
  } catch (e) {
    setStatus("서버와 연결이 끊어졌습니다. 터미널에서 다시 실행해 주세요.", false);
  }
  const delay = document.hidden ? 5000 : (snap && snap.working ? 900 : 3500);
  setTimeout(poll, delay);
}

/* ---------------- 렌더 ---------------- */
function visible() {
  const items = (snap.repos || []).filter((r) => {
    if (filter === "update" && !r.has_update) return false;
    if (filter === "dirty" && !r.dirty) return false;
    if (filter === "clean" && r.state !== "clean") return false;
    if (filter === "issue" && !["error", "no-upstream", "detached"].includes(r.state)) return false;
    if (query) {
      const q = query.toLowerCase();
      if (!r.name.toLowerCase().includes(q) && !r.path.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  items.sort(SORTS[sortBy] || SORTS.priority);
  return items;
}

function render() {
  const c = snap.counts;
  $("#subtitle").textContent = c.total
    ? `저장소 ${c.total}개 · 업데이트 ${c.update}개 · 로컬 변경 ${c.dirty}개`
    : (snap.scanning ? "저장소를 찾고 있습니다…" : "저장소를 찾지 못했습니다");
  $("#wsinfo").textContent = `폴더 ${snap.config.roots.length}개 · 저장소 ${c.total}개`;
  const chipCounts = { all: c.total, update: c.update, dirty: c.dirty, clean: c.clean, issue: c.issue };
  document.querySelectorAll(".chip").forEach((ch) => {
    const on = ch.dataset.f === filter;
    ch.querySelector("b").textContent = chipCounts[ch.dataset.f] ?? "";
    ch.classList.toggle("on", on);
    ch.setAttribute("aria-selected", on ? "true" : "false");
  });
  $("#navcount").textContent = c.update || "";
  $("#allcount").textContent = c.update ? ` ${c.update}` : "";
  $("#btn-updateall").disabled = !c.update || snap.scanning;
  $("#strategy").value = snap.config.pull_strategy;
  $("#gitver").textContent = snap.app.git.replace("git version ", "git ");
  syncNav();

  $("#progress").classList.toggle("on", !!snap.working);
  if (snap.scanning && snap.total) setStatus(`상태 확인 중 ${snap.total - snap.pending}/${snap.total}`, true);
  else if (snap.scanning) setStatus("저장소 검색 중…", true);
  else if (snap.repos.some((r) => r.busy)) setStatus("작업 진행 중…", true);
  else setStatus(c.update ? `${c.update}개 저장소에 받을 커밋이 있습니다` : "모두 최신 상태입니다", false);

  renderList();
  renderTally();
  renderLogs();
  firstLoad = false;
}

function setStatus(text, working) {
  $("#statustext").textContent = text;
  $("#status").classList.toggle("working", !!working);
}

function renderList() {
  const list = $("#list");
  const items = visible();

  if (!items.length) {
    rows.clear();
    list.replaceChildren();
    if (snap.scanning && !snap.repos.length) {
      for (let i = 0; i < 4; i++) list.appendChild(el("div", "skel"));
      return;
    }
    const box = el("div", "empty");
    if (!snap.config.roots.length) {
      box.append(el("h3", null, "검색할 폴더가 없습니다"));
      box.append(el("p", null, "git 저장소가 모여 있는 폴더를 추가하면 목록이 채워집니다."));
      const b = el("button", "btn accent", "폴더 추가");
      b.onclick = openSettings;
      box.append(b);
    } else if (snap.repos.length) {
      box.append(el("h3", null, "조건에 맞는 저장소가 없습니다"));
      box.append(el("p", null, "검색어나 필터를 바꿔보세요."));
    } else {
      box.append(el("h3", null, "저장소를 찾지 못했습니다"));
      box.append(el("p", null, "설정에서 검색 폴더나 탐색 깊이를 조정해 보세요."));
      const b = el("button", "btn", "설정 열기");
      b.onclick = openSettings;
      box.append(b);
    }
    list.appendChild(box);
    return;
  }

  const keep = new Set();
  items.forEach((r, i) => {
    keep.add(r.path);
    let row = rows.get(r.path);
    if (!row) { row = buildRow(r); rows.set(r.path, row); }
    updateRow(row, r);
    if (list.children[i] !== row.node) list.insertBefore(row.node, list.children[i] || null);
  });
  [...rows.keys()].forEach((p) => { if (!keep.has(p)) { rows.get(p).node.remove(); rows.delete(p); } });
  [...list.children].forEach((n) => { if (!n.classList.contains("repo")) n.remove(); });
}

function buildRow(r) {
  const node = el("article", "repo");
  node.dataset.path = r.path;

  const badge = el("span", "repo-icon");
  badge.innerHTML = REPO_ICON;

  const body = el("div", "body");
  const row1 = el("div", "row1");
  const name = el("h3", "name");
  const branch = el("span", "branch");
  const pill = el("span", "pill");
  const dot = el("span", "dot");
  row1.append(name, branch, pill, dot);
  const meta = el("div", "meta");
  const path = el("div", "path");
  const note = el("div", "note");
  note.hidden = true;
  body.append(row1, meta, path, note);

  const side = el("div", "side");
  const when = el("span", "when");
  const update = el("button", "btn");
  update.onclick = () => doPull(r.path);
  const more = el("button", "btn icon quiet");
  more.setAttribute("aria-label", "추가 작업");
  more.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>';
  more.onclick = (ev) => showMenu(ev, r.path);
  side.append(when, update, more);

  node.append(badge, body, side);
  return { node, name, branch, pill, meta, path, note, when, update, more };
}

function busyInfo(r) {
  if (!r.busy) return null;
  const [kind, mode] = String(r.busy).split(":");
  return { kind, mode: mode || "", label: BUSY_LABEL[kind] || "진행 중" };
}

/* 배지가 개수를 들고 간다. 같은 숫자를 아래 줄과 버튼에서 반복하지 않는다. */
function pillText(r) {
  if (r.state === "behind") return `업데이트 ${r.behind}`;
  if (r.state === "ahead") return `푸시 대기 ${r.ahead}`;
  return STATE_LABEL[r.state] || "";
}

function updateRow(row, r) {
  const { node } = row;
  const busy = busyInfo(r);
  node.dataset.state = r.state;
  node.classList.toggle("busy", !!busy);
  row.name.textContent = r.name;
  row.branch.textContent = r.state === "loading" ? "-" : (r.detached ? "HEAD " + r.branch : (r.branch || "-"));
  row.pill.textContent = busy ? busy.label : pillText(r);
  row.pill.className = "pill " + (busy ? "behind" : (PILL_CLASS[r.state] || ""));
  row.path.textContent = r.display_path;
  row.when.textContent = r.fetch_age || "";

  row.meta.replaceChildren();
  const add = (text, cls) => { if (text) row.meta.append(el("span", cls || null, text)); };
  const dot = () => row.meta.append(el("span", "sep", "·"));
  const first = () => row.meta.childElementCount && dot();
  if (r.state === "loading") { add("상태 확인 중…"); }
  else if (r.error) { add(r.error); }
  else {
    if (r.behind && r.state !== "behind") { add(`받을 커밋 ${r.behind}`, "num down"); }
    if (r.ahead && r.state !== "ahead") { first(); add(`보낼 커밋 ${r.ahead}`, "num up"); }
    if (!r.upstream && !r.detached) { first(); add("업스트림 없음"); }
    if (r.changed) { first(); add(`수정 ${r.changed}`); }
    if (r.untracked) { first(); add(`추적 안 됨 ${r.untracked}`); }
    if (r.stash_count) {
      first();
      const b = el("button", "chipmini", `보관 ${r.stash_count}`);
      b.title = "보관(stash) 항목 관리";
      b.onclick = (ev) => { ev.stopPropagation(); openStash(r.path); };
      row.meta.append(b);
    }
    if (!r.behind && !r.ahead && !r.dirty && r.upstream) { first(); add("최신 상태"); }
  }

  const res = r.result;
  if (res && res.age < 90) {
    row.note.hidden = false;
    row.note.className = "note " + (res.ok ? (res.warn ? "warn" : "ok") : "err");
    row.note.replaceChildren(el("span", null, res.text));
    if (res.suggest && res.suggest.length) {
      const acts = el("div", "noteacts");
      res.suggest.forEach((s) => {
        if (s === "rebase" || s === "merge") {
          const b = el("button", "btn tiny", `${s} 로 다시 시도`);
          b.onclick = () => doPull(r.path, s);
          acts.append(b);
        } else if (s === "stash") {
          const b = el("button", "btn tiny", "보관하고 다시 시도");
          b.title = "git stash push -u 후 다시 pull";
          b.onclick = () => stashThenPull(r.path);
          acts.append(b);
        }
      });
      const manage = el("button", "btn tiny", "보관 관리");
      manage.onclick = () => openStash(r.path);
      acts.append(manage);
      row.note.append(acts);
    }
  } else {
    row.note.hidden = true;
  }

  const blocked = r.state === "loading" || r.state === "no-upstream" || r.state === "detached";
  row.update.disabled = blocked || !!busy;
  row.update.classList.toggle("accent", r.has_update && !busy);
  row.update.replaceChildren();
  if (busy) {
    row.update.append(el("span", "spin"));
    row.update.append(document.createTextNode(busy.kind === "pull" && busy.mode ? busy.mode : busy.label));
  } else {
    row.update.textContent = "업데이트";
    row.update.title = r.state === "no-upstream" ? "업스트림이 없어 받을 수 없습니다"
      : r.state === "detached" ? "HEAD 가 분리되어 있어 받을 수 없습니다"
      : r.diverged && snap.config.pull_strategy === "ff-only"
        ? "분기된 상태라 ff-only 로는 중단됩니다. ⋯ 메뉴에서 rebase / merge 를 쓰세요."
        : `git pull --${snap.config.pull_strategy}`;
  }
}

function renderTally() {
  const c = snap.counts;
  $("#tallytitle").textContent = `전체 ${c.total}개`;
  const box = $("#tallybody");
  if ($("#tallyhead").getAttribute("aria-expanded") !== "true") return;
  const buckets = new Map();
  (snap.repos || []).forEach((r) => buckets.set(r.state, (buckets.get(r.state) || 0) + 1));
  box.replaceChildren();
  if (!buckets.size) {
    box.append(el("p", "muted", "아직 집계할 저장소가 없습니다."));
    return;
  }
  [...buckets.entries()].sort((a, b) => b[1] - a[1]).forEach(([state, n]) => {
    const line = el("div", "tallyline");
    line.dataset.state = state;
    line.append(el("span", "dot"), el("span", "tallyname", STATE_LABEL[state] || state), el("b", "num", String(n)));
    box.append(line);
  });
}

function renderLogs() {
  const logs = snap.logs || [];
  $("#logcount").textContent = logs.length ? `${logs.length}줄` : "";
  const box = $("#logbody");
  if (view !== "activity") return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 30;
  box.replaceChildren();
  if (!logs.length) {
    box.append(el("p", "muted", "아직 실행 기록이 없습니다."));
    return;
  }
  logs.forEach((l) => {
    const line = el("div", "logline " + (l.level || "info"));
    line.append(el("span", "ts", l.t), el("span", "msg", l.text));
    box.append(line);
  });
  if (atBottom) box.scrollTop = box.scrollHeight;
}

/* ---------------- 화면 밝기 ---------------- */
/* 기본값은 light. 서버(config.json)에 저장하므로 다시 켜도 유지된다. */
const systemDark = matchMedia("(prefers-color-scheme: dark)");
let theme = document.querySelector('meta[name=gitupdate-theme]').content;

function applyTheme(pref) {
  theme = THEME_ORDER.includes(pref) ? pref : "light";
  const dark = theme === "dark" || (theme === "auto" && systemDark.matches);
  document.documentElement.classList.toggle("dark", dark);
  const next = THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];
  const btn = $("#btn-theme");
  btn.innerHTML = THEME_ICON[theme];
  btn.append(el("span", null, THEME_LABEL[theme]));
  btn.title = `화면 밝기: ${THEME_LABEL[theme]} · 눌러서 ${THEME_LABEL[next]}`;
  btn.setAttribute("aria-label", btn.title);
}
systemDark.addEventListener("change", () => { if (theme === "auto") applyTheme("auto"); });
$("#btn-theme").onclick = async () => {
  const next = THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];
  applyTheme(next);
  try { await api("/api/config", { theme: next }); } catch (e) {}
};
applyTheme(theme);

/* ---------------- 화면 이동 ---------------- */
function syncNav() {
  document.querySelectorAll(".nav-item").forEach((n) => {
    const on = n.dataset.view === view
      && (!n.dataset.filter || n.dataset.filter === filter || (n.dataset.filter === "all" && filter !== "update"));
    n.classList.toggle("on", !!on);
    if (on) n.setAttribute("aria-current", "page");
    else n.removeAttribute("aria-current");
  });
}
function setView(next) {
  view = next;
  document.body.dataset.view = view;
  $("#viewtitle").textContent = VIEW_TITLE[view] || "Repositories";
  syncNav();
  if (snap) renderLogs();
}

/* ---------------- 동작 ---------------- */
function markBusy(path, busy) {
  const r = (snap.repos || []).find((x) => x.path === path);
  const row = rows.get(path);
  if (r) { r.busy = busy; if (row) updateRow(row, r); }
}
async function doPull(path, strategy) {
  markBusy(path, "pull:" + (strategy || snap.config.pull_strategy));
  await api("/api/pull", strategy ? { path, strategy } : { path });
  bump();
}
async function doFetch(path) {
  markBusy(path, "fetch");
  await api("/api/fetch", { path });
  bump();
}
async function doStash(path, kind, ref, message, untracked) {
  markBusy(path, "stash");
  await api("/api/stash", { path, kind, ref, message: message || "", untracked: untracked !== false });
  bump();
}
/* 작업이 끝날 때까지 기다린다 (연속 동작용) */
async function waitIdle(path, timeout = 90000) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeout) {
    await new Promise((r) => setTimeout(r, 450));
    try { snap = await api("/api/state"); render(); } catch (e) { return null; }
    const r = (snap.repos || []).find((x) => x.path === path);
    if (r && !r.busy) return r;
  }
  return null;
}
async function stashThenPull(path) {
  await doStash(path, "push", "", "Git Update: 업데이트 전 보관", true);
  const r = await waitIdle(path);
  if (!r) return;
  await doPull(path);
}
async function bump() {
  try { snap = await api("/api/state"); render(); } catch (e) {}
}

function toast(kind, title, text) {
  const t = el("div", "toast " + kind);
  const box = el("div");
  box.append(el("strong", null, title));
  if (text) box.append(el("span", null, text));
  t.append(box);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), 5200);
}

/* 결과 알림: 새 결과가 생기면 토스트 */
let seenResults = new Map();
function watchResults() {
  if (!snap) return;
  (snap.repos || []).forEach((r) => {
    if (!r.result) return;
    const key = r.result.ts;
    if (seenResults.get(r.path) === key) return;
    if (!firstLoad && r.result.age < 8) {
      const kind = r.result.ok ? (r.result.warn ? "warn" : "ok") : "err";
      toast(kind, r.name, r.result.text);
    }
    seenResults.set(r.path, key);
  });
}
setInterval(watchResults, 600);

function showMenu(ev, path) {
  ev.stopPropagation();
  closeMenu();
  const m = el("div", "menu");
  const item = (label, icon, fn) => {
    const b = el("button");
    b.innerHTML = icon;
    b.append(document.createTextNode(label));
    b.onclick = () => { closeMenu(); fn(); };
    return b;
  };
  const ico = {
    fetch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>',
    rebase: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="18" r="2.4"/><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="9" r="2.4"/><path d="M6 8.4v7.2M8.4 6.6 15.6 8.4"/></svg>',
    merge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 8.4v7.2M8.2 6.8c5 .6 7 1.9 7.6 4.4M8.2 17.2c5-.6 7-1.9 7.6-4.4"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M2.5 4.5h19V8h-19zM10 12h4"/></svg>',
    finder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/></svg>',
    term: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  };
  const repo = (snap.repos || []).find((x) => x.path === path) || {};
  const blocked = ["loading", "no-upstream", "detached"].includes(repo.state) || !!repo.busy;

  m.append(item("원격 확인 (fetch)", ico.fetch, () => doFetch(path)));
  m.append(document.createElement("hr"));
  const rb = item("rebase 로 업데이트", ico.rebase, () => doPull(path, "rebase"));
  const mg = item("merge 로 업데이트", ico.merge, () => doPull(path, "merge"));
  rb.title = "git pull --rebase --autostash";
  mg.title = "git pull --no-rebase --no-edit";
  if (blocked) { rb.disabled = true; mg.disabled = true; }
  m.append(rb, mg);
  m.append(document.createElement("hr"));
  m.append(item("지금 변경 보관 (stash)", ico.box, () => doStash(path, "push", "", "", true)));
  m.append(item(`보관 항목 관리${repo.stash_count ? ` (${repo.stash_count})` : ""}`, ico.box, () => openStash(path)));
  m.append(document.createElement("hr"));
  m.append(item("Finder에서 열기", ico.finder, () => api("/api/reveal", { path })));
  m.append(item("터미널에서 열기", ico.term, () => api("/api/terminal", { path })));
  m.append(item("경로 복사", ico.copy, async () => {
    try { await navigator.clipboard.writeText(path); toast("ok", "경로를 복사했습니다", path); }
    catch (e) { toast("err", "복사 실패", "브라우저가 클립보드를 막았습니다"); }
  }));
  document.body.append(m);
  const rect = ev.currentTarget.getBoundingClientRect();
  const top = Math.min(rect.bottom + 6 + scrollY, scrollY + innerHeight - m.offsetHeight - 12);
  m.style.top = top + "px";
  m.style.left = Math.max(12, rect.right - m.offsetWidth) + "px";
  openMenu = m;
}
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
addEventListener("click", closeMenu);
addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
/* 목록이 자체 스크롤 영역이라 스크롤이 시작되면 메뉴를 닫는다 (capture 로 내부 스크롤까지 잡는다) */
addEventListener("scroll", closeMenu, true);

/* ---------------- 설정 ---------------- */
function openSettings() {
  draftRoots = [...snap.config.roots];
  $("#depth").value = snap.config.max_depth;
  $("#excludes").value = snap.config.excludes.join(", ");
  $("#autostash").checked = snap.config.autostash;
  $("#fetchstart").checked = snap.config.fetch_on_start;
  drawRoots();
  $("#settings").showModal();
}
function drawRoots() {
  const box = $("#rootlist");
  box.replaceChildren();
  if (!draftRoots.length) {
    const p = el("div", "root");
    p.append(el("span", null, "아직 없습니다. 아래에서 폴더를 추가하세요."));
    box.append(p);
    return;
  }
  draftRoots.forEach((r, i) => {
    const line = el("div", "root");
    line.append(el("span", null, r.replace(/^\/Users\/[^/]+/, "~")));
    const rm = el("button");
    rm.setAttribute("aria-label", "삭제");
    rm.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    rm.onclick = () => { draftRoots.splice(i, 1); drawRoots(); };
    line.append(rm);
    box.append(line);
  });
}
$("#btn-pick").onclick = async () => {
  const res = await api("/api/pick-folder", {});
  if (res.path && !draftRoots.includes(res.path)) { draftRoots.push(res.path); drawRoots(); }
};
$("#rootinput").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const v = e.target.value.trim();
  if (v && !draftRoots.includes(v)) { draftRoots.push(v); drawRoots(); }
  e.target.value = "";
});
$("#btn-cancel").onclick = () => $("#settings").close();
$("#btn-save").onclick = async () => {
  const pending = $("#rootinput").value.trim();
  if (pending && !draftRoots.includes(pending)) draftRoots.push(pending);
  await api("/api/config", {
    roots: draftRoots,
    max_depth: Number($("#depth").value) || 4,
    excludes: $("#excludes").value.split(",").map((s) => s.trim()).filter(Boolean),
    autostash: $("#autostash").checked,
    fetch_on_start: $("#fetchstart").checked,
    rescan: true,
  });
  $("#settings").close();
  toast("ok", "설정을 저장했습니다", "다시 검색하는 중입니다");
  bump();
};

/* ---------------- 보관(stash) 창 ---------------- */
let stashPath = null;

async function openStash(path) {
  closeMenu();
  stashPath = path;
  const r = (snap.repos || []).find((x) => x.path === path);
  $("#stashrepo").textContent = r ? `${r.name} · ${r.display_path}` : path;
  $("#stashmsg").value = "";
  $("#stashuntracked").checked = true;
  await loadStashes();
  if (!$("#stashdlg").open) $("#stashdlg").showModal();
}

async function loadStashes() {
  const box = $("#stashlist");
  box.replaceChildren(el("p", "muted", "불러오는 중…"));
  let entries = [];
  try {
    const res = await api("/api/stash/list", { path: stashPath });
    entries = res.entries || [];
  } catch (e) {
    box.replaceChildren(el("p", "muted", "목록을 불러오지 못했습니다."));
    return;
  }
  $("#stashcount").textContent = entries.length ? `${entries.length}개` : "";
  box.replaceChildren();
  if (!entries.length) {
    box.append(el("p", "muted", "보관된 항목이 없습니다."));
    return;
  }
  entries.forEach((e) => {
    const item = el("div", "stashitem");
    const si = el("div", "si");
    si.append(el("div", "si-msg", e.message || e.subject));
    si.append(el("div", "si-meta", `${e.ref} · ${e.branch || "-"} · ${e.age || ""} · ${e.sha}`));
    const acts = el("div", "si-acts");
    const pop = el("button", "btn tiny", "꺼내기");
    pop.title = "git stash pop — 작업 트리로 되돌리고 목록에서 제거";
    pop.onclick = () => stashAct("pop", e.ref);
    const apply = el("button", "btn tiny", "적용");
    apply.title = "git stash apply — 되돌리되 목록에 남겨둠";
    apply.onclick = () => stashAct("apply", e.ref);
    const drop = el("button", "btn tiny danger", "삭제");
    drop.title = "git stash drop — 되돌리기 어려움";
    drop.onclick = () => stashAct("drop", e.ref, e);
    acts.append(pop, apply, drop);
    item.append(si, acts);
    box.append(item);
  });
}

async function stashAct(kind, ref, entry) {
  if (kind === "drop") {
    const label = entry ? `${ref} (${entry.message || entry.subject})` : ref;
    if (!confirm(`보관 항목을 삭제합니다.\n\n${label}\n\n되돌리기 어렵습니다. 계속할까요?`)) return;
  }
  const box = $("#stashlist");
  box.replaceChildren(el("p", "muted", "처리 중…"));
  await doStash(stashPath, kind, ref);
  await waitIdle(stashPath);
  await loadStashes();
}

$("#btn-stashnow").onclick = async () => {
  const msg = $("#stashmsg").value;
  const untracked = $("#stashuntracked").checked;
  $("#stashmsg").value = "";
  $("#stashlist").replaceChildren(el("p", "muted", "보관 중…"));
  await doStash(stashPath, "push", "", msg, untracked);
  await waitIdle(stashPath);
  await loadStashes();
};
$("#btn-stashclose").onclick = () => $("#stashdlg").close();

/* ---------------- 상단·사이드 버튼 ---------------- */
$("#btn-refresh").onclick = async () => { await api("/api/refresh", { fetch: false }); bump(); };
$("#btn-fetch").onclick = async () => {
  await api("/api/refresh", { fetch: true });
  toast("ok", "원격 확인 시작", "저장소 수에 따라 몇 초 걸립니다");
  bump();
};
$("#btn-updateall").onclick = async () => {
  const targets = (snap.repos || []).filter((r) => r.has_update);
  if (!targets.length) return;
  const names = targets.slice(0, 12).map((t) => "· " + t.name + (t.diverged ? "  (분기됨)" : "")).join("\n");
  const diverged = targets.filter((t) => t.diverged).length;
  const warn = diverged && snap.config.pull_strategy === "ff-only"
    ? `\n\n분기된 저장소 ${diverged}개는 ff-only 로는 중단됩니다. 각 저장소에서 rebase / merge 를 쓰거나 기본 방식을 바꿔주세요.` : "";
  if (!confirm(`저장소 ${targets.length}개를 ${snap.config.pull_strategy} 방식으로 업데이트합니다.\n\n${names}${targets.length > 12 ? "\n…" : ""}${warn}`)) return;
  await api("/api/pull-all", {});
  bump();
};
$("#btn-workspace").onclick = openSettings;
$("#btn-help").onclick = () => $("#helpdlg").showModal();
$("#btn-helpclose").onclick = () => $("#helpdlg").close();
$("#btn-quit").onclick = async () => {
  if (!confirm("Git Update 서버를 종료합니다. 이 탭은 닫아도 됩니다.")) return;
  try { await api("/api/quit", {}); } catch (e) {}
  document.body.innerHTML = '<div class="empty gone"><h3>종료했습니다</h3><p>이 탭을 닫으세요. 다시 쓰려면 GitUpdate.command 를 실행하면 됩니다.</p></div>';
};
$("#strategy").onchange = async (e) => {
  await api("/api/config", { pull_strategy: e.target.value });
  toast("ok", "업데이트 방식 변경", e.target.value);
  bump();
};
$("#sortby").onchange = (e) => { sortBy = e.target.value; if (snap) renderList(); };
$("#search").addEventListener("input", (e) => { query = e.target.value.trim(); if (snap) renderList(); });
$("#chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  filter = chip.dataset.f;
  if (snap) render();
});
$("#layout").addEventListener("click", (e) => {
  const seg = e.target.closest(".seg");
  if (!seg) return;
  $("#list").classList.toggle("grid", seg.dataset.layout === "grid");
  document.querySelectorAll("#layout .seg").forEach((b) => {
    const on = b === seg;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
});
$("#nav").addEventListener("click", (e) => {
  const item = e.target.closest(".nav-item");
  if (!item) return;
  if (item.dataset.act === "settings") { openSettings(); return; }
  if (item.dataset.filter) filter = item.dataset.filter;
  setView(item.dataset.view || "repos");
  if (snap) render();
});
const toggleTally = () => {
  const head = $("#tallyhead");
  const open = head.getAttribute("aria-expanded") === "true";
  head.setAttribute("aria-expanded", open ? "false" : "true");
  $("#tally").classList.toggle("open", !open);
  if (snap) renderTally();
};
$("#tallyhead").onclick = toggleTally;

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)
    || $("#settings").open || $("#stashdlg").open || $("#helpdlg").open;
  if (e.key === "/" && !typing) {
    e.preventDefault();
    if (view !== "repos") { setView("repos"); if (snap) render(); }  /* 검색창은 목록 화면에만 있다 */
    $("#search").focus();
  }
  else if ((e.key === "r" || e.key === "R") && !typing) $("#btn-refresh").click();
  else if ((e.key === "f" || e.key === "F") && !typing) $("#btn-fetch").click();
  else if (e.key === "," && !typing) { e.preventDefault(); openSettings(); }
});

poll();
</script>
</body>
</html>
