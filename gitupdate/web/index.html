<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="gitupdate-token" content="__TOKEN__">
<meta name="color-scheme" content="light dark">
<title>Git Update</title>
<style>
:root{
  --bg:#faf9f5; --bg-sunk:#f2f0e8; --surface:#ffffff; --surface-2:#f7f6f1;
  --border:#e6e2d7; --border-strong:#d8d3c5;
  --text:#191919; --text-2:#5d5b55; --text-3:#8f8d85;
  --accent:#d97757; --accent-hover:#c4623f; --accent-soft:#fbeee7; --accent-line:#f0d3c4;
  --green:#4a7c59; --green-soft:#eef4ef;
  --amber:#a9762c; --amber-soft:#fbf2e2;
  --red:#b4453a; --red-soft:#fbedeb;
  --slate:#6b7a8f; --slate-soft:#eef1f5;
  --gray:#82807a; --gray-soft:#f1f0ea;
  --shadow-sm:0 1px 2px rgba(25,25,25,.05);
  --shadow-md:0 4px 16px -4px rgba(25,25,25,.12), 0 1px 3px rgba(25,25,25,.06);
  --radius:14px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  --serif:ui-serif,"Iowan Old Style","Apple Garamond",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1f1e1c; --bg-sunk:#191817; --surface:#282725; --surface-2:#2f2e2b;
    --border:#3a3835; --border-strong:#4a4844;
    --text:#f5f4ee; --text-2:#b8b5ac; --text-3:#8b8880;
    --accent:#e08a68; --accent-hover:#eb9c7c; --accent-soft:#3a2a22; --accent-line:#5a4033;
    --green:#7fb08d; --green-soft:#25302a;
    --amber:#d5a457; --amber-soft:#332b1d;
    --red:#e08379; --red-soft:#38241f;
    --slate:#9aa9bd; --slate-soft:#252b33;
    --gray:#a3a09a; --gray-soft:#2c2b28;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 6px 20px -6px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------- 상단 ---------- */
.top{
  position:sticky; top:0; z-index:30; background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--border);
}
.progress{height:2px;background:transparent;overflow:hidden}
.progress.on{background:var(--accent-line)}
.progress.on::after{
  content:""; display:block; height:2px; width:35%; background:var(--accent);
  animation:slide 1.15s ease-in-out infinite;
}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
.head{display:flex;align-items:flex-end;gap:18px;padding:18px 0 14px}
.brand h1{
  font-family:var(--serif); font-size:26px; font-weight:600; letter-spacing:-.02em;
  margin:0 0 2px;
}
.brand p{margin:0;color:var(--text-2);font-size:12.5px;letter-spacing:.01em}
.head .grow{flex:1}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:8px 13px;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  font-size:13px; font-weight:500; box-shadow:var(--shadow-sm);
  transition:background .14s ease,border-color .14s ease,transform .14s ease,opacity .14s;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(217,119,87,.35)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--text)}
.btn.icon{padding:8px;width:34px;justify-content:center}
.btn svg{width:15px;height:15px;flex:none}

/* ---------- 필터 ---------- */
.tools{display:flex;gap:10px;align-items:center;padding:0 0 14px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px;max-width:330px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3)}
.search input{
  width:100%;padding:9px 12px 9px 33px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface);box-shadow:var(--shadow-sm);
}
.search input::placeholder{color:var(--text-3)}
.chips{display:flex;gap:5px;background:var(--bg-sunk);padding:3px;border-radius:11px}
.chip{
  border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:12.5px;
  color:var(--text-2);font-weight:500;transition:background .14s,color .14s;
}
.chip:hover{color:var(--text)}
.chip.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.chip b{font-variant-numeric:tabular-nums;font-weight:600;margin-left:5px;color:var(--text-3)}
.chip.on b{color:var(--accent)}
.spacer{flex:1}
.field{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2)}
.field select{
  padding:8px 10px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface);box-shadow:var(--shadow-sm);font-size:13px;
}

/* ---------- 목록 ---------- */
main{max-width:1060px;margin:0 auto;padding:18px 22px 0}
.list{display:flex;flex-direction:column;gap:9px}
.repo{
  position:relative;display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px 14px 18px;box-shadow:var(--shadow-sm);overflow:hidden;
  transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease;
}
.repo:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.repo::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gray);opacity:.85;
}
.repo[data-state="behind"]::before{background:var(--accent)}
.repo[data-state="diverged"]::before{background:var(--amber)}
.repo[data-state="clean"]::before{background:var(--green)}
.repo[data-state="dirty"]::before{background:var(--amber)}
.repo[data-state="ahead"]::before{background:var(--slate)}
.repo[data-state="error"]::before{background:var(--red)}
.repo[data-state="loading"]::before{background:var(--border-strong)}
.repo.busy{border-color:var(--accent-line);background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box}

.body{flex:1;min-width:0}
.row1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.name{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
.pill{
  font-size:11px;font-weight:600;padding:2.5px 8px;border-radius:999px;
  background:var(--gray-soft);color:var(--gray);letter-spacing:.01em;white-space:nowrap;
}
.pill.behind{background:var(--accent-soft);color:var(--accent)}
.pill.diverged{background:var(--amber-soft);color:var(--amber)}
.pill.clean{background:var(--green-soft);color:var(--green)}
.pill.dirty{background:var(--amber-soft);color:var(--amber)}
.pill.ahead{background:var(--slate-soft);color:var(--slate)}
.pill.error{background:var(--red-soft);color:var(--red)}
.meta{margin-top:3px;font-size:12.5px;color:var(--text-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta .sep{color:var(--border-strong)}
.meta .num{font-variant-numeric:tabular-nums;font-weight:600}
.meta .down{color:var(--accent)}
.meta .up{color:var(--slate)}
.path{
  margin-top:5px;font-family:var(--mono);font-size:11.5px;color:var(--text-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.note{
  margin-top:8px;font-size:12.5px;padding:8px 10px;border-radius:9px;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);
  display:flex;flex-direction:column;gap:7px;align-items:flex-start;line-height:1.45;
}
.noteacts{display:flex;gap:6px;flex-wrap:wrap}
.btn.tiny{padding:4px 10px;font-size:12px;border-radius:8px;box-shadow:none}
.btn.danger{color:var(--red);border-color:var(--border-strong)}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.chipmini{
  border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-2);
  font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:500;
}
.chipmini:hover{border-color:var(--accent);color:var(--accent)}
.muted{color:var(--text-3);font-size:12.5px;margin:0;padding:6px 2px}
.note[hidden]{display:none}   /* display:flex 가 hidden 속성을 덮어쓰는 것 방지 */
.note.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.note.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.note.err{background:var(--red-soft);color:var(--red);border-color:transparent}
.note code{font-family:var(--mono);font-size:11.5px}
.side{display:flex;align-items:center;gap:6px;flex:none}

.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* 스켈레톤 */
.skel{height:74px;border-radius:var(--radius);border:1px solid var(--border);background:
  linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 40%,var(--surface) 80%);
  background-size:300% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-40% 0}}

.empty{
  text-align:center;padding:60px 20px;color:var(--text-2);
  border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface);
}
.empty h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 6px;color:var(--text)}
.empty p{margin:0 0 16px;font-size:13px}

/* ---------- 메뉴 ---------- */
.menu{
  position:absolute;z-index:60;min-width:186px;padding:5px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow-md);
}
.menu button{
  display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  padding:8px 10px;border-radius:8px;font-size:13px;text-align:left;color:var(--text);
}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 2px}
.menu svg{width:14px;height:14px;color:var(--text-3)}

/* ---------- 기록 ---------- */
.logwrap{max-width:1060px;margin:22px auto 0;padding:0 22px}
.logcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.loghead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
.loghead h2{font-size:12.5px;font-weight:600;margin:0;letter-spacing:.02em;color:var(--text-2);text-transform:uppercase}
.loghead .count{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.loghead .chev{margin-left:auto;color:var(--text-3);transition:transform .18s}
.logcard.open .chev{transform:rotate(180deg)}
.logbody{display:none;max-height:270px;overflow:auto;padding:2px 14px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.65}
.logcard.open .logbody{display:block}
.logline{display:flex;gap:9px;white-space:pre-wrap;word-break:break-word}
.logline .ts{color:var(--text-3);flex:none}
.logline.ok .msg{color:var(--green)}
.logline.warn .msg{color:var(--amber)}
.logline.err .msg{color:var(--red)}
.logline.detail .msg{color:var(--text-3)}

/* ---------- 하단 바 ---------- */
.footer{
  position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
}
.footer .inner{max-width:1060px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;gap:12px}
.status{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:8px;min-width:0}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.status.working .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.footer .grow{flex:1}
.footer .hint{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}

/* ---------- 모달 ---------- */
dialog{
  border:1px solid var(--border-strong);border-radius:18px;padding:0;max-width:560px;width:calc(100% - 40px);
  background:var(--surface);color:var(--text);box-shadow:0 24px 60px -12px rgba(0,0,0,.3);
}
dialog::backdrop{background:rgba(25,25,25,.34);backdrop-filter:blur(2px)}
.dlg-head{padding:20px 22px 6px}
.dlg-head h2{font-family:var(--serif);font-size:20px;margin:0 0 3px;font-weight:600}
.dlg-head p{margin:0;font-size:12.5px;color:var(--text-2)}
.dlg-body{padding:14px 22px 4px;max-height:min(62vh,520px);overflow:auto}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 20px}
.group{margin-bottom:18px}
.group>label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px;letter-spacing:.02em}
.rootlist{display:flex;flex-direction:column;gap:6px;margin-bottom:9px}
.root{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);font-family:var(--mono);font-size:12px;
}
.root span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.root button{border:0;background:transparent;color:var(--text-3);padding:2px;border-radius:6px;display:flex}
.root button:hover{color:var(--red);background:var(--red-soft)}
.inline{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.inline input[type=number]{width:74px;padding:8px 10px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface)}
.inline input[type=text]{flex:1;min-width:220px;padding:8px 11px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-family:var(--mono);font-size:12px}
.check{display:flex;gap:9px;align-items:flex-start;padding:9px 0;font-size:13px;color:var(--text)}
.check input{margin:2px 0 0;accent-color:var(--accent);width:16px;height:16px}
.check small{display:block;color:var(--text-3);font-size:11.5px;margin-top:2px}

/* 보관 목록 */
.stashlist{display:flex;flex-direction:column;gap:6px}
.stashitem{
  display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--border);
}
.stashitem .si{flex:1;min-width:0}
.stashitem .si-msg{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stashitem .si-meta{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:2px}
.stashitem .si-acts{display:flex;gap:5px;flex:none}

/* ---------- 토스트 ---------- */
.toasts{position:fixed;right:20px;bottom:64px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{
  display:flex;gap:9px;align-items:flex-start;max-width:380px;padding:11px 13px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow-md);
  font-size:12.5px;animation:rise .22s ease;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.toast.ok{border-left:3px solid var(--green)}
.toast.warn{border-left:3px solid var(--amber)}
.toast.err{border-left:3px solid var(--red)}
.toast strong{display:block;font-size:12.5px;margin-bottom:1px}
.toast span{color:var(--text-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:720px){
  .head{flex-direction:column;align-items:flex-start;gap:12px}
  .acts{justify-content:flex-start}
  .repo{flex-direction:column;align-items:flex-start}
  .side{width:100%;justify-content:flex-end}
}
</style>
</head>
<body>
<div class="top">
  <div class="progress" id="progress"></div>
  <div class="wrap">
    <div class="head">
      <div class="brand">
        <h1>Git Update</h1>
        <p id="subtitle">저장소를 찾고 있습니다…</p>
      </div>
      <div class="grow"></div>
      <div class="acts">
        <button class="btn quiet" id="btn-refresh" title="다시 검색 (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          새로고침
        </button>
        <button class="btn" id="btn-fetch" title="모든 저장소의 원격 상태 확인 (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          원격 확인
        </button>
        <button class="btn primary" id="btn-updateall">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21V9"/><path d="M7 14l5 5 5-5"/><path d="M5 4h14"/></svg>
          전체 업데이트<span id="allcount"></span>
        </button>
        <button class="btn icon" id="btn-settings" aria-label="설정" title="설정 (,)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 7L4.6 7a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="이름 또는 경로 검색  ( / )" autocomplete="off" spellcheck="false">
      </div>
      <div class="chips" id="chips" role="tablist">
        <button class="chip on" data-f="all" role="tab">전체<b></b></button>
        <button class="chip" data-f="update" role="tab">업데이트<b></b></button>
        <button class="chip" data-f="dirty" role="tab">로컬 변경<b></b></button>
        <button class="chip" data-f="clean" role="tab">최신<b></b></button>
        <button class="chip" data-f="issue" role="tab">확인 필요<b></b></button>
      </div>
      <div class="spacer"></div>
      <label class="field">기본 방식
        <select id="strategy" title="업데이트 버튼이 쓰는 기본 방식입니다. 저장소별로는 ⋯ 메뉴에서 rebase / merge 를 바로 실행할 수 있습니다.&#10;ff-only: 로컬 커밋이 있으면 중단 (안전)&#10;rebase: 원격 커밋 위로 내 커밋을 다시 쌓음&#10;merge: 병합 커밋을 만들어 합침">
          <option value="ff-only">ff-only</option>
          <option value="rebase">rebase</option>
          <option value="merge">merge</option>
        </select>
      </label>
    </div>
  </div>
</div>

<main>
  <div class="list" id="list"></div>
  <div class="logwrap" style="padding:0">
    <div class="logcard" id="logcard">
      <div class="loghead" id="loghead" role="button" tabindex="0" aria-expanded="false">
        <h2>실행 기록</h2>
        <span class="count" id="logcount"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="logbody" id="logbody"></div>
    </div>
  </div>
</main>

<div class="footer">
  <div class="inner">
    <div class="status" id="status"><span class="dot"></span><span id="statustext">준비 중</span></div>
    <div class="grow"></div>
    <span class="hint" id="gitver"></span>
    <button class="btn quiet" id="btn-quit" title="서버 종료">종료</button>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog id="settings">
  <div class="dlg-head">
    <h2>설정</h2>
    <p>git 저장소를 찾을 폴더와 업데이트 방식을 정합니다.</p>
  </div>
  <div class="dlg-body">
    <div class="group">
      <label>검색할 폴더</label>
      <div class="rootlist" id="rootlist"></div>
      <div class="inline">
        <button class="btn" id="btn-pick">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/></svg>
          폴더 선택
        </button>
        <input type="text" id="rootinput" placeholder="또는 경로 직접 입력 후 Enter  (예: ~/work)">

    </div>
    <div class="group">
      <label>하위 탐색 깊이 / 제외 폴더</label>
      <div class="inline">
        <input type="number" id="depth" min="1" max="8" step="1">
        <input type="text" id="excludes" placeholder="node_modules, .venv, build">
      </div>
    </div>
    <div class="group">
      <label>업데이트 동작</label>
      <label class="check"><input type="checkbox" id="autostash">
        <span>업데이트 전 로컬 변경 자동 보관
          <small>git pull --autostash. 끝나면 되돌려 놓습니다.</small></span>
      </label>
      <label class="check"><input type="checkbox" id="fetchstart">
        <span>시작할 때 모든 저장소 원격 확인
          <small>정확한 "받을 커밋" 수를 바로 보여주지만 저장소가 많으면 몇 초 걸립니다.</small></span>
      </label>
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="btn-cancel">취소</button>
    <button class="btn primary" id="btn-save">저장하고 다시 검색</button>

</dialog>

<dialog id="stashdlg">
  <div class="dlg-head">
    <h2>보관 (stash)</h2>
    <p id="stashrepo"></p>
  </div>
  <div class="dlg-body">
    <div class="group">
      <label>지금 작업 내용 보관</label>
      <div class="inline">
        <input type="text" id="stashmsg" placeholder="메모 (선택)  예: 작업 중 UI 수정">
        <button class="btn primary" id="btn-stashnow">보관하기</button>
      </div>
      <label class="check"><input type="checkbox" id="stashuntracked" checked>
        <span>추적 안 된 새 파일도 함께 보관
          <small>git stash push --include-untracked</small></span>
      </label>
    </div>
    <div class="group">
      <label>보관된 항목 <span id="stashcount" style="color:var(--text-3);font-weight:500"></span></label>
      <div class="stashlist" id="stashlist"></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="btn-stashclose">닫기</button>
  </div>
</dialog>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name=gitupdate-token]').content;
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

const STATE_LABEL = {
  behind: "업데이트 있음", diverged: "분기됨", clean: "최신", dirty: "로컬 변경", ahead: "푸시 대기",
  "no-upstream": "원격 없음", detached: "HEAD 분리", error: "오류", loading: "확인 중",
};
const PILL_CLASS = { behind:"behind", diverged:"diverged", clean:"clean", dirty:"dirty", ahead:"ahead", error:"error" };
const BUSY_LABEL = { pull: "업데이트 중", fetch: "확인 중", stash: "보관 처리 중" };

let snap = null;            // 서버 상태
let filter = "all";
let query = "";
let openMenu = null;
let firstLoad = true;
const rows = new Map();     // path -> {node, refs}
let draftRoots = null;

/* ---------------- 통신 ---------------- */
async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body || {}),
  });
  if (!res.ok) throw new Error(path + " → " + res.status);
  return res.json();
}

async function poll() {
  try {
    snap = await api("/api/state");
    render();
  } catch (e) {
    setStatus("서버와 연결이 끊어졌습니다. 터미널에서 다시 실행해 주세요.", false);
  }
  const delay = document.hidden ? 5000 : (snap && snap.working ? 900 : 3500);
  setTimeout(poll, delay);
}

/* ---------------- 렌더 ---------------- */
function visible() {
  const items = (snap.repos || []).filter((r) => {
    if (filter === "update" && !r.has_update) return false;
    if (filter === "dirty" && !r.dirty) return false;
    if (filter === "clean" && r.state !== "clean") return false;
    if (filter === "issue" && !["error", "no-upstream", "detached"].includes(r.state)) return false;
    if (query) {
      const q = query.toLowerCase();
      if (!r.name.toLowerCase().includes(q) && !r.path.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  items.sort((a, b) => a.rank - b.rank || a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
  return items;
}

function render() {
  const c = snap.counts;
  $("#subtitle").textContent = c.total
    ? `저장소 ${c.total}개 · 업데이트 ${c.update}개 · 로컬 변경 ${c.dirty}개`
    : (snap.scanning ? "저장소를 찾고 있습니다…" : "저장소를 찾지 못했습니다");
  const chipCounts = { all: c.total, update: c.update, dirty: c.dirty, clean: c.clean, issue: c.issue };
  document.querySelectorAll(".chip").forEach((ch) => {
    ch.querySelector("b").textContent = chipCounts[ch.dataset.f] ?? "";
    ch.classList.toggle("on", ch.dataset.f === filter);
  });
  $("#allcount").textContent = c.update ? ` ${c.update}` : "";
  $("#btn-updateall").disabled = !c.update || snap.scanning;
  $("#strategy").value = snap.config.pull_strategy;
  $("#gitver").textContent = snap.app.git.replace("git version ", "git ");

  $("#progress").classList.toggle("on", !!snap.working);
  if (snap.scanning && snap.total) setStatus(`상태 확인 중 ${snap.total - snap.pending}/${snap.total}`, true);
  else if (snap.scanning) setStatus("저장소 검색 중…", true);
  else if (snap.repos.some((r) => r.busy)) setStatus("작업 진행 중…", true);
  else setStatus(c.update ? `${c.update}개 저장소에 받을 커밋이 있습니다` : "모두 최신 상태입니다", false);

  renderList();
  renderLogs();
  firstLoad = false;
}

function setStatus(text, working) {
  $("#statustext").textContent = text;
  $("#status").classList.toggle("working", !!working);
}

function renderList() {
  const list = $("#list");
  const items = visible();

  if (!items.length) {
    rows.clear();
    list.replaceChildren();
    if (snap.scanning && !snap.repos.length) {
      for (let i = 0; i < 4; i++) list.appendChild(el("div", "skel"));
      return;
    }
    const box = el("div", "empty");
    if (!snap.config.roots.length) {
      box.append(el("h3", null, "검색할 폴더가 없습니다"));
      box.append(el("p", null, "git 저장소가 모여 있는 폴더를 추가하면 목록이 채워집니다."));
      const b = el("button", "btn primary", "폴더 추가");
      b.onclick = openSettings;
      box.append(b);
    } else if (snap.repos.length) {
      box.append(el("h3", null, "조건에 맞는 저장소가 없습니다"));
      box.append(el("p", null, "검색어나 필터를 바꿔보세요."));
    } else {
      box.append(el("h3", null, "저장소를 찾지 못했습니다"));
      box.append(el("p", null, "설정에서 검색 폴더나 탐색 깊이를 조정해 보세요."));
      const b = el("button", "btn", "설정 열기");
      b.onclick = openSettings;
      box.append(b);
    }
    list.appendChild(box);
    return;
  }

  const keep = new Set();
  items.forEach((r, i) => {
    keep.add(r.path);
    let row = rows.get(r.path);
    if (!row) { row = buildRow(r); rows.set(r.path, row); }
    updateRow(row, r);
    if (list.children[i] !== row.node) list.insertBefore(row.node, list.children[i] || null);
  });
  [...rows.keys()].forEach((p) => { if (!keep.has(p)) { rows.get(p).node.remove(); rows.delete(p); } });
  [...list.children].forEach((n) => { if (!n.classList.contains("repo")) n.remove(); });
}

function buildRow(r) {
  const node = el("article", "repo");
  node.dataset.path = r.path;
  const body = el("div", "body");
  const row1 = el("div", "row1");
  const name = el("h3", "name");
  const pill = el("span", "pill");
  row1.append(name, pill);
  const meta = el("div", "meta");
  const path = el("div", "path");
  const note = el("div", "note");
  note.hidden = true;
  body.append(row1, meta, path, note);

  const side = el("div", "side");
  const update = el("button", "btn primary");
  update.onclick = () => doPull(r.path);
  const more = el("button", "btn icon quiet");
  more.setAttribute("aria-label", "추가 작업");
  more.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>';
  more.onclick = (ev) => showMenu(ev, r.path);
  side.append(update, more);

  node.append(body, side);
  return { node, name, pill, meta, path, note, update, more };
}

function busyInfo(r) {
  if (!r.busy) return null;
  const [kind, mode] = String(r.busy).split(":");
  return { kind, mode: mode || "", label: BUSY_LABEL[kind] || "진행 중" };
}

function updateRow(row, r) {
  const { node } = row;
  const busy = busyInfo(r);
  node.dataset.state = r.state;
  node.classList.toggle("busy", !!busy);
  row.name.textContent = r.name;
  row.pill.textContent = busy ? busy.label : (STATE_LABEL[r.state] || "");
  row.pill.className = "pill " + (busy ? "behind" : (PILL_CLASS[r.state] || ""));
  row.path.textContent = r.display_path;

  row.meta.replaceChildren();
  const add = (text, cls) => { if (text) row.meta.append(el("span", cls || null, text)); };
  const dot = () => row.meta.append(el("span", "sep", "·"));
  if (r.state === "loading") { add("상태 확인 중…"); }
  else if (r.error) { add(r.error); }
  else {
    add(r.detached ? "HEAD " + r.branch : r.branch);
    if (r.behind) { dot(); add(`받을 커밋 ${r.behind}`, "num down"); }
    if (r.ahead) { dot(); add(`보낼 커밋 ${r.ahead}`, "num up"); }
    if (!r.upstream && !r.detached) { dot(); add("업스트림 없음"); }
    if (r.changed) { dot(); add(`수정 ${r.changed}`); }
    if (r.untracked) { dot(); add(`추적 안 됨 ${r.untracked}`); }
    if (r.stash_count) {
      dot();
      const b = el("button", "chipmini", `보관 ${r.stash_count}`);
      b.title = "보관(stash) 항목 관리";
      b.onclick = (ev) => { ev.stopPropagation(); openStash(r.path); };
      row.meta.append(b);
    }
    if (!r.behind && !r.ahead && !r.dirty && r.upstream) { dot(); add("최신 상태"); }
    if (r.fetch_age) { dot(); add("확인 " + r.fetch_age); }
  }

  const res = r.result;
  if (res && res.age < 90) {
    row.note.hidden = false;
    row.note.className = "note " + (res.ok ? (res.warn ? "warn" : "ok") : "err");
    row.note.replaceChildren(el("span", null, res.text));
    if (res.suggest && res.suggest.length) {
      const acts = el("div", "noteacts");
      res.suggest.forEach((s) => {
        if (s === "rebase" || s === "merge") {
          const b = el("button", "btn tiny", `${s} 로 다시 시도`);
          b.onclick = () => doPull(r.path, s);
          acts.append(b);
        } else if (s === "stash") {
          const b = el("button", "btn tiny", "보관하고 다시 시도");
          b.title = "git stash push -u 후 다시 pull";
          b.onclick = () => stashThenPull(r.path);
          acts.append(b);
        }
      });
      const manage = el("button", "btn tiny", "보관 관리");
      manage.onclick = () => openStash(r.path);
      acts.append(manage);
      row.note.append(acts);
    }
  } else {
    row.note.hidden = true;
  }

  const blocked = r.state === "loading" || r.state === "no-upstream" || r.state === "detached";
  row.update.disabled = blocked || !!busy;
  row.update.classList.toggle("primary", r.has_update && !busy);
  row.update.replaceChildren();
  if (busy) {
    row.update.append(el("span", "spin"));
    row.update.append(document.createTextNode(busy.kind === "pull" && busy.mode ? busy.mode : busy.label));
  } else {
    row.update.textContent = r.has_update ? `업데이트 ${r.behind}` : "업데이트";
    row.update.title = r.state === "no-upstream" ? "업스트림이 없어 받을 수 없습니다"
      : r.state === "detached" ? "HEAD 가 분리되어 있어 받을 수 없습니다"
      : r.diverged && snap.config.pull_strategy === "ff-only"
        ? "분기된 상태라 ff-only 로는 중단됩니다. ⋯ 메뉴에서 rebase / merge 를 쓰세요."
        : `git pull --${snap.config.pull_strategy}`;
  }
}

function renderLogs() {
  const logs = snap.logs || [];
  $("#logcount").textContent = logs.length ? `${logs.length}줄` : "";
  const box = $("#logbody");
  if (!$("#logcard").classList.contains("open")) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 30;
  box.replaceChildren();
  logs.forEach((l) => {
    const line = el("div", "logline " + (l.level || "info"));
    line.append(el("span", "ts", l.t), el("span", "msg", l.text));
    box.append(line);
  });
  if (atBottom) box.scrollTop = box.scrollHeight;
}

/* ---------------- 동작 ---------------- */
function markBusy(path, busy) {
  const r = (snap.repos || []).find((x) => x.path === path);
  const row = rows.get(path);
  if (r) { r.busy = busy; if (row) updateRow(row, r); }
}
async function doPull(path, strategy) {
  markBusy(path, "pull:" + (strategy || snap.config.pull_strategy));
  await api("/api/pull", strategy ? { path, strategy } : { path });
  bump();
}
async function doFetch(path) {
  markBusy(path, "fetch");
  await api("/api/fetch", { path });
  bump();
}
async function doStash(path, kind, ref, message, untracked) {
  markBusy(path, "stash");
  await api("/api/stash", { path, kind, ref, message: message || "", untracked: untracked !== false });
  bump();
}
/* 작업이 끝날 때까지 기다린다 (연속 동작용) */
async function waitIdle(path, timeout = 90000) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeout) {
    await new Promise((r) => setTimeout(r, 450));
    try { snap = await api("/api/state"); render(); } catch (e) { return null; }
    const r = (snap.repos || []).find((x) => x.path === path);
    if (r && !r.busy) return r;
  }
  return null;
}
async function stashThenPull(path) {
  await doStash(path, "push", "", "Git Update: 업데이트 전 보관", true);
  const r = await waitIdle(path);
  if (!r) return;
  await doPull(path);
}
async function bump() {
  try { snap = await api("/api/state"); render(); } catch (e) {}
}

function toast(kind, title, text) {
  const t = el("div", "toast " + kind);
  const box = el("div");
  box.append(el("strong", null, title));
  if (text) box.append(el("span", null, text));
  t.append(box);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), 5200);
}

/* 결과 알림: 새 결과가 생기면 토스트 */
let seenResults = new Map();
function watchResults() {
  if (!snap) return;
  (snap.repos || []).forEach((r) => {
    if (!r.result) return;
    const key = r.result.ts;
    if (seenResults.get(r.path) === key) return;
    if (!firstLoad && r.result.age < 8) {
      const kind = r.result.ok ? (r.result.warn ? "warn" : "ok") : "err";
      toast(kind, r.name, r.result.text);
    }
    seenResults.set(r.path, key);
  });
}
setInterval(watchResults, 600);

function showMenu(ev, path) {
  ev.stopPropagation();
  closeMenu();
  const m = el("div", "menu");
  const item = (label, icon, fn) => {
    const b = el("button");
    b.innerHTML = icon;
    b.append(document.createTextNode(label));
    b.onclick = () => { closeMenu(); fn(); };
    return b;
  };
  const ico = {
    fetch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>',
    rebase: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="18" r="2.4"/><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="9" r="2.4"/><path d="M6 8.4v7.2M8.4 6.6 15.6 8.4"/></svg>',
    merge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 8.4v7.2M8.2 6.8c5 .6 7 1.9 7.6 4.4M8.2 17.2c5-.6 7-1.9 7.6-4.4"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M2.5 4.5h19V8h-19zM10 12h4"/></svg>',
    finder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/></svg>',
    term: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  };
  const repo = (snap.repos || []).find((x) => x.path === path) || {};
  const blocked = ["loading", "no-upstream", "detached"].includes(repo.state) || !!repo.busy;

  m.append(item("원격 확인 (fetch)", ico.fetch, () => doFetch(path)));
  m.append(document.createElement("hr"));
  const rb = item("rebase 로 업데이트", ico.rebase, () => doPull(path, "rebase"));
  const mg = item("merge 로 업데이트", ico.merge, () => doPull(path, "merge"));
  rb.title = "git pull --rebase --autostash";
  mg.title = "git pull --no-rebase --no-edit";
  if (blocked) { rb.disabled = true; mg.disabled = true; rb.style.opacity = mg.style.opacity = ".45"; }
  m.append(rb, mg);
  m.append(document.createElement("hr"));
  m.append(item("지금 변경 보관 (stash)", ico.box, () => doStash(path, "push", "", "", true)));
  m.append(item(`보관 항목 관리${repo.stash_count ? ` (${repo.stash_count})` : ""}`, ico.box, () => openStash(path)));
  m.append(document.createElement("hr"));
  m.append(item("Finder에서 열기", ico.finder, () => api("/api/reveal", { path })));
  m.append(item("터미널에서 열기", ico.term, () => api("/api/terminal", { path })));
  m.append(item("경로 복사", ico.copy, async () => {
    try { await navigator.clipboard.writeText(path); toast("ok", "경로를 복사했습니다", path); }
    catch (e) { toast("err", "복사 실패", "브라우저가 클립보드를 막았습니다"); }
  }));
  document.body.append(m);
  const rect = ev.currentTarget.getBoundingClientRect();
  const top = Math.min(rect.bottom + 6 + scrollY, scrollY + innerHeight - m.offsetHeight - 12);
  m.style.top = top + "px";
  m.style.left = Math.max(12, rect.right - m.offsetWidth) + "px";
  openMenu = m;
}
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
addEventListener("click", closeMenu);
addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

/* ---------------- 설정 ---------------- */
function openSettings() {
  draftRoots = [...snap.config.roots];
  $("#depth").value = snap.config.max_depth;
  $("#excludes").value = snap.config.excludes.join(", ");
  $("#autostash").checked = snap.config.autostash;
  $("#fetchstart").checked = snap.config.fetch_on_start;
  drawRoots();
  $("#settings").showModal();
}
function drawRoots() {
  const box = $("#rootlist");
  box.replaceChildren();
  if (!draftRoots.length) {
    const p = el("div", "root");
    p.append(el("span", null, "아직 없습니다. 아래에서 폴더를 추가하세요."));
    box.append(p);
    return;
  }
  draftRoots.forEach((r, i) => {
    const line = el("div", "root");
    line.append(el("span", null, r.replace(/^\/Users\/[^/]+/, "~")));
    const rm = el("button");
    rm.setAttribute("aria-label", "삭제");
    rm.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    rm.onclick = () => { draftRoots.splice(i, 1); drawRoots(); };
    line.append(rm);
    box.append(line);
  });
}
$("#btn-pick").onclick = async () => {
  const res = await api("/api/pick-folder", {});
  if (res.path && !draftRoots.includes(res.path)) { draftRoots.push(res.path); drawRoots(); }
};
$("#rootinput").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const v = e.target.value.trim();
  if (v && !draftRoots.includes(v)) { draftRoots.push(v); drawRoots(); }
  e.target.value = "";
});
$("#btn-cancel").onclick = () => $("#settings").close();
$("#btn-save").onclick = async () => {
  const pending = $("#rootinput").value.trim();
  if (pending && !draftRoots.includes(pending)) draftRoots.push(pending);
  await api("/api/config", {
    roots: draftRoots,
    max_depth: Number($("#depth").value) || 4,
    excludes: $("#excludes").value.split(",").map((s) => s.trim()).filter(Boolean),
    autostash: $("#autostash").checked,
    fetch_on_start: $("#fetchstart").checked,
    rescan: true,
  });
  $("#settings").close();
  toast("ok", "설정을 저장했습니다", "다시 검색하는 중입니다");
  bump();
};

/* ---------------- 보관(stash) 창 ---------------- */
let stashPath = null;

async function openStash(path) {
  closeMenu();
  stashPath = path;
  const r = (snap.repos || []).find((x) => x.path === path);
  $("#stashrepo").textContent = r ? `${r.name} · ${r.display_path}` : path;
  $("#stashmsg").value = "";
  $("#stashuntracked").checked = true;
  await loadStashes();
  if (!$("#stashdlg").open) $("#stashdlg").showModal();
}

async function loadStashes() {
  const box = $("#stashlist");
  box.replaceChildren(el("p", "muted", "불러오는 중…"));
  let entries = [];
  try {
    const res = await api("/api/stash/list", { path: stashPath });
    entries = res.entries || [];
  } catch (e) {
    box.replaceChildren(el("p", "muted", "목록을 불러오지 못했습니다."));
    return;
  }
  $("#stashcount").textContent = entries.length ? `${entries.length}개` : "";
  box.replaceChildren();
  if (!entries.length) {
    box.append(el("p", "muted", "보관된 항목이 없습니다."));
    return;
  }
  entries.forEach((e) => {
    const item = el("div", "stashitem");
    const si = el("div", "si");
    si.append(el("div", "si-msg", e.message || e.subject));
    si.append(el("div", "si-meta", `${e.ref} · ${e.branch || "-"} · ${e.age || ""} · ${e.sha}`));
    const acts = el("div", "si-acts");
    const pop = el("button", "btn tiny", "꺼내기");
    pop.title = "git stash pop — 작업 트리로 되돌리고 목록에서 제거";
    pop.onclick = () => stashAct("pop", e.ref);
    const apply = el("button", "btn tiny", "적용");
    apply.title = "git stash apply — 되돌리되 목록에 남겨둠";
    apply.onclick = () => stashAct("apply", e.ref);
    const drop = el("button", "btn tiny danger", "삭제");
    drop.title = "git stash drop — 되돌리기 어려움";
    drop.onclick = () => stashAct("drop", e.ref, e);
    acts.append(pop, apply, drop);
    item.append(si, acts);
    box.append(item);
  });
}

async function stashAct(kind, ref, entry) {
  if (kind === "drop") {
    const label = entry ? `${ref} (${entry.message || entry.subject})` : ref;
    if (!confirm(`보관 항목을 삭제합니다.\n\n${label}\n\n되돌리기 어렵습니다. 계속할까요?`)) return;
  }
  const box = $("#stashlist");
  box.replaceChildren(el("p", "muted", "처리 중…"));
  await doStash(stashPath, kind, ref);
  await waitIdle(stashPath);
  await loadStashes();
}

$("#btn-stashnow").onclick = async () => {
  const msg = $("#stashmsg").value;
  const untracked = $("#stashuntracked").checked;
  $("#stashmsg").value = "";
  $("#stashlist").replaceChildren(el("p", "muted", "보관 중…"));
  await doStash(stashPath, "push", "", msg, untracked);
  await waitIdle(stashPath);
  await loadStashes();
};
$("#btn-stashclose").onclick = () => $("#stashdlg").close();

/* ---------------- 상단 버튼 ---------------- */
$("#btn-refresh").onclick = async () => { await api("/api/refresh", { fetch: false }); bump(); };
$("#btn-fetch").onclick = async () => {
  await api("/api/refresh", { fetch: true });
  toast("ok", "원격 확인 시작", "저장소 수에 따라 몇 초 걸립니다");
  bump();
};
$("#btn-updateall").onclick = async () => {
  const targets = (snap.repos || []).filter((r) => r.has_update);
  if (!targets.length) return;
  const names = targets.slice(0, 12).map((t) => "· " + t.name + (t.diverged ? "  (분기됨)" : "")).join("\n");
  const diverged = targets.filter((t) => t.diverged).length;
  const warn = diverged && snap.config.pull_strategy === "ff-only"
    ? `\n\n분기된 저장소 ${diverged}개는 ff-only 로는 중단됩니다. 각 저장소에서 rebase / merge 를 쓰거나 기본 방식을 바꿔주세요.` : "";
  if (!confirm(`저장소 ${targets.length}개를 ${snap.config.pull_strategy} 방식으로 업데이트합니다.\n\n${names}${targets.length > 12 ? "\n…" : ""}${warn}`)) return;
  await api("/api/pull-all", {});
  bump();
};
$("#btn-settings").onclick = openSettings;
$("#btn-quit").onclick = async () => {
  if (!confirm("Git Update 서버를 종료합니다. 이 탭은 닫아도 됩니다.")) return;
  try { await api("/api/quit", {}); } catch (e) {}
  document.body.innerHTML = '<div class="empty" style="margin:120px auto;max-width:420px"><h3>종료했습니다</h3><p>이 탭을 닫으세요. 다시 쓰려면 GitUpdate.command 를 실행하면 됩니다.</p></div>';
};
$("#strategy").onchange = async (e) => {
  await api("/api/config", { pull_strategy: e.target.value });
  toast("ok", "업데이트 방식 변경", e.target.value);
  bump();
};
$("#search").addEventListener("input", (e) => { query = e.target.value.trim(); renderList(); });
$("#chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  filter = chip.dataset.f;
  render();
});
const toggleLog = () => {
  const card = $("#logcard");
  card.classList.toggle("open");
  $("#loghead").setAttribute("aria-expanded", card.classList.contains("open"));
  renderLogs();
};
$("#loghead").onclick = toggleLog;
$("#loghead").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleLog(); } });

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)
    || $("#settings").open || $("#stashdlg").open;
  if (e.key === "/" && !typing) { e.preventDefault(); $("#search").focus(); }
  else if ((e.key === "r" || e.key === "R") && !typing) $("#btn-refresh").click();
  else if ((e.key === "f" || e.key === "F") && !typing) $("#btn-fetch").click();
  else if (e.key === "," && !typing) { e.preventDefault(); openSettings(); }
});

poll();
</script>
</body>
</html>
